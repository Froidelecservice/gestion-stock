<body>

<h2>
Gestion de Stock Véhicule - FES / FCM
</h2>


<div class="top-bar">

    <button id="btnAdd" class="btn">
        ➕ Ajouter
    </button>

    <button id="btnOrder" class="btn">
        📦 À commander
    </button>

    <button id="btnPDF" class="btn">
        📝 PDF
    </button>

    <button id="btnExportCSV" class="btn">
        📄 Export CSV
    </button>

    <button id="btnExportCSVPositif" class="btn">
        📄 CSV Stock +
    </button>

    <button id="btnExportExcel" class="btn">

    </button>

type="file"
id="jsonBackup"

<div class="search-bar">

        🔍 Recherche :
    </label>

    <input
    type="text"
    id="search"
    placeholder="Référence codial, fournisseur, machine...">

</div>

<form id="formStock">

    <h3 id="formTitle">
        Nouvel article
    </h3>

    <div class="row">

        <div class="field">
            <label>Référence Codial</label>
            <input
            type="text"
            name="codial">
        </div>

        <div class="field">
            <label>Fournisseur</label>

        </div>

        <div class="field">
            <label>Machine</label>
            <input
            type="text"
            name="machine">
        </div>

        <div class="field">
            <label>Marque</label>
            <input
            type="text"
            name="marque">
        </div>

    </div>

    <div class="row">

        <div class="field">
            <label>Matériel</label>
            <input
            type="text"
            name="materiel">
        </div>

        <div class="field">
            <label>Référence</label>
            <input
            type="text"
            name="reference">
        </div>

        <div class="field">
            <label>Dénomination</label>

            type="text"

        <div class="field">

            value="0">

            <label>Stock minimum</label>
            <input
            type="number"
            name="minimum"
            value="0">
        </div>

    </div>

    <button
    type="button"
    id="btnSave">

    💾 Enregistrer

    </button>

</form>

<div class="table-container">

<table id="tableStock">

<thead>

<tr>

    <th>CODIAL</th>

    <th>FOURNISSEUR</th>

    <th>MACHINE</th>

    <th>MARQUE</th>

    <th>MATÉRIEL</th>

    <th>RÉFÉRENCE</th>

    <th>DÉNOMINATION</th>

    <th>DÉBUT</th>

    <th>ENTRÉES</th>

    <th>SORTIES</th>

    <th>STOCK FIN</th>

    <th>MIN</th>

    <th>ENTRÉE</th>

    <th>SORTIE</th>

    <th>MODIFIER</th>

    <th>SUPPRIMER</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

<script>

/* ===================================
   VARIABLES GLOBALES
=================================== */

let stock =
JSON.parse(
    localStorage.getItem(
        "stockData"
    ) || "[]"
);

/* ===============================
   RESTAURATION DE SECOURS
=============================== */

if(stock.length === 0){

    const backup =
    localStorage.getItem(
        "stockDataBackup"
    );

    if(backup){

        try{

            stock =
            JSON.parse(
                backup
            ).data || [];

        }
        catch(e){

            console.log(
                "Backup invalide"
            );

        }

    }

}

let indexEnEdition = null;

/* ===============================
   INDEX RECHERCHE
=============================== */

function creerIndexRecherche(item){

    item._search =

    (
        (item.codial || "") + " " +
        (item.fournisseur || "") + " " +
        (item.machine || "") + " " +
        (item.marque || "") + " " +
        (item.materiel || "") + " " +
        (item.reference || "") + " " +
        (item.denomination || "")
    )

    .toLowerCase();

    return item;
}

stock =
stock.map(
    creerIndexRecherche
);

/* ===================================
   SAUVEGARDE
=================================== */

function sauvegarder(){

    localStorage.setItem(
        "stockData",
        JSON.stringify(stock)
    );

    localStorage.setItem(
        "stockDataBackup",
        JSON.stringify({
            date:
            new Date().toISOString(),
            data:
            stock
        })
    );

}

/* ===================================
   EXPORT JSON
=================================== */

function sauvegardeFichier(){

    const contenu = {

        application:
        "Gestion Stock FES FCM",

        date:
        new Date()
        .toLocaleString(),

        nombreArticles:
        stock.length,

        stock:
        stock

    };

    const blob =
    new Blob(
        [
            JSON.stringify(
                contenu,
                null,
                2
            )
        ],
        {
            type:
            "application/json"
        }
    );

    const lien =
    document.createElement("a");

    lien.href =
    URL.createObjectURL(blob);

    lien.download =
    "Stock_FES_FCM_" +
    new Date()
    .toISOString()
    .slice(0,19)
    .replace(/:/g,"-")
    + ".json";

    lien.click();
}

/* ===================================
   STOCK
=================================== */

function stockFin(item){
    return (
        Number(item.debut || 0) +
        Number(item.entrees || 0) -
        Number(item.sorties || 0)
    );
}
/* ===================================
   MODE SOMBRE
=================================== */

function appliqueModeSombreAuto(){

    const heure =
    new Date().getHours();

    if(
        heure >= 18 ||
        heure < 7
    ) {

        document.body.classList.add(
            "dark"
        );

    }
    else{

        document.body.classList.remove(
            "dark"
        );

    }

}

/* ===================================
   FILTRE
=================================== */

function filtrerStock(texte){

    texte =
    texte.toLowerCase();

    if(!texte){

        return stock;
    }

    return stock.filter(
        item =>
        (item._search || "").includes(texte)  
  );

}

/* ===================================
   AFFICHAGE CORRIGÉ
=================================== */

function afficher(){

    const tbody =
    document.querySelector(
        "#tableStock tbody"
    );

    const filtre =
    document.getElementById(
        "search"
    ).value;

    const liste =
    filtrerStock(
        filtre
    );

    let html = "";

    liste.forEach(item => {

        const vraiIndex =
        stock.indexOf(item);

        const fin =
        stockFin(item);

let classe = "";

if(
    item.qteCommande &&
    item.qteCommande > 0
){
    classe = "commande-passee";
}
else if(
    fin < item.minimum
){
    classe = "alert";
}

        html += `

<tr class="${classe}">

<td>${item.codial || ""}</td>

<td>${item.fournisseur || ""}</td>

<td>${item.machine || ""}</td>

<td>${item.marque || ""}</td>

<td>${item.materiel || ""}</td>

<td>${item.reference || ""}</td>

<td>${item.denomination || ""}</td>

<td>${item.debut || 0}</td>

<td>${item.entrees || 0}</td>

<td>${item.sorties || 0}</td>

<td>${fin}</td>

<td>${item.minimum || 0}</td>

<td>

<button
class="btn-small btn-entree"
onclick="ajouterEntree(${vraiIndex})">

Entrée +

</button>

</td>

<td>

<button
class="btn-small btn-sortie"
onclick="ajouterSortie(${vraiIndex})">

Sortie -

</button>

</td>

<td>

<button
class="btn-small btn-modifier"
onclick="modifierArticle(${vraiIndex})">

Modifier

</button>

</td>

<td>

<button
class="btn-small btn-delete"
onclick="supprimer(${vraiIndex})">

❌

</button>

</td>

</tr>

`;

    });

    tbody.innerHTML =
    html;

}

/* ===================================
   FORMULAIRE
=================================== */

function remplirForm(item){

    const form =
    document.getElementById(
        "formStock"
    );

    form.elements["codial"].value =
    item.codial || "";

    form.elements["fournisseur"].value =
    item.fournisseur || "";

    form.elements["machine"].value =
    item.machine || "";

    form.elements["marque"].value =
    item.marque || "";

    form.elements["materiel"].value =
    item.materiel || "";

    form.elements["reference"].value =
    item.reference || "";

    form.elements["denomination"].value =
    item.denomination || "";

    form.elements["debut"].value =
    item.debut || 0;

    form.elements["entrees"].value =
    item.entrees || 0;

    form.elements["sorties"].value =
    item.sorties || 0;

    form.elements["minimum"].value =
    item.minimum || 0;

}

function resetForm(){
form.elements["debut"].value = 0;
form.elements["entrees"].value = 0;
form.elements["sorties"].value = 0;
form.elements["minimum"].value = 0;
    document
    .getElementById(
        "formStock"
    )
    .reset();

    document
    .getElementById(
        "formStock"
    )
    .style.display =
    "none";

    indexEnEdition =
    null;

}

/* ===================================
   SUPPRESSION
=================================== */

function supprimer(index){

    if(
        !confirm(
            "Supprimer cet article ?"
        )
    ){

        return;

    }

    stock.splice(
        index,
        1
    );

    sauvegarder();

    afficher();

}

/* ===================================
   ENTREE
=================================== */

function ajouterEntree(index){

    const q =
    Number(
        prompt(
            "Quantité entrée :"
        )
    );

    if(q > 0){

        stock[index].entrees =
        Number(
            stock[index].entrees || 0
        ) + q;

        const nouveauStock =
        stockFin(stock[index]);

        if(
            nouveauStock >=
            stock[index].minimum
        ){
            stock[index].qteCommande = 0;
        }

        sauvegarder();
        afficher();
    }
}
/* ===================================
   SORTIE
=================================== */

function ajouterSortie(index){

    const q =
    Number(
        prompt(
            "Quantité sortie :"
        )
    );

    if(q > 0){

        stock[index].sorties += Number(stock[index].sorties || 0) + q;

        sauvegarder();

        afficher();

    }

}

/* ===================================
   MODIFICATION
=================================== */

function modifierArticle(index){

    if(
        index < 0 ||
        index >= stock.length
    ){

        alert(
            "Article introuvable."
        );

        return;
    }

    indexEnEdition =
    index;

    remplirForm(
        stock[index]
    );

    document
    .getElementById(
        "formStock"
    )
    .style.display =
    "block";

    document
    .getElementById(
        "formTitle"
    )
    .textContent =
    "Modifier l'article";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/* ===================================
   AJOUT ARTICLE
=================================== */

document
.getElementById(
    "btnAdd"
)
.onclick = () => {

    indexEnEdition =
    null;

    document
    .getElementById(
        "formTitle"
    )
    .textContent =
    "Nouvel article";

    document
    .getElementById(
        "formStock"
    )
    .reset();

    document
    .getElementById(
        "formStock"
    )
    .style.display =
    "block";

};

/* ===================================
   ENREGISTREMENT
=================================== */

document
.getElementById(
    "btnSave"
)
.onclick = () => {

    const form =

    document.getElementById(
        "formStock"
    );

    const data =

    Object.fromEntries(
        new FormData(form).entries()
    );

    const item =

    creerIndexRecherche({

        codial:
        data.codial || "",

        fournisseur:
        data.fournisseur || "",

        machine:
        data.machine || "",

        marque:
        data.marque || "",

        materiel:
        data.materiel || "",

        reference:
        data.reference || "",

        denomination:
        data.denomination || "",

        debut:
        Number(data.debut) || 0,

        entrees:
        Number(data.entrees) || 0,

        sorties:
        Number(data.sorties) || 0,

        minimum:
        Number(data.minimum) || 0

    });

    if(
        indexEnEdition === null
    ){

        stock.push(item);

    }
    else{

        stock[indexEnEdition] =
        item;

    }

    sauvegarder();

    afficher();

    resetForm();

};

/* ===================================
   RECHERCHE
=================================== */

let timerRecherche;

document
.getElementById(
    "search"
)
.addEventListener(
    "input",
    () => {

        clearTimeout(
            timerRecherche
        );

        timerRecherche =
        setTimeout(
            afficher,
            250
        );

    }
);

/* ===================================
   SAUVEGARDE JSON
=================================== */

document
.getElementById(
    "btnBackup"
)
.onclick =
sauvegardeFichier;

/* ===================================
   RESTAURATION JSON
=================================== */

document
.getElementById(
    "btnRestore"
)
.onclick = () => {

    document
    .getElementById(
        "jsonBackup"
    )
    .click();

};

document
.getElementById(
    "jsonBackup"
)
.addEventListener(
"change",
function(){

    const file =
    this.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        try{

            const json =

            JSON.parse(
                e.target.result
            );

            stock =
            (json.stock || [])
            .map(
                creerIndexRecherche
            );

            sauvegarder();

            afficher();

            alert(
                "Sauvegarde restaurée."
            );

        }
        catch(err){

            alert(
                "Fichier invalide."
            );

        }

    };

    reader.readAsText(
        file,
        "UTF-8"
    );

});

/* ===================================
   IMPORT
=================================== */

document
.getElementById(
    "btnImport"
)
.onclick = () => {

    document
    .getElementById(
        "fileInput"
    )
    .click();

};

/* ===================================
   EXPORT CSV
=================================== */

document
.getElementById(
    "btnExportCSV"
)
.onclick = () => {

    let csv =

`Reference codial;Fournisseur;Machine;Marque;Materiel;Reference;Denomination;Debut;Entrees;Sorties;StockFin;Minimum
`;

    stock.forEach(a => {

        csv +=

`${a.codial};${a.fournisseur};${a.machine};${a.marque};${a.materiel};${a.reference};${a.denomination};${a.debut};${a.entrees};${a.sorties};${stockFin(a)};${a.minimum}
`;

    });

    const blob =
    new Blob(
        [csv],
        {
            type:
            "text/csv"
        }
    );

    const url =
    URL.createObjectURL(
        blob
    );

    const lien =
    document.createElement(
        "a"
    );

    lien.href = url;

    lien.download =
    "stock_fes_fcm.csv";

    lien.click();

};
/* ===================================
   EXPORT CSV +
=================================== */
document
.getElementById("btnExportCSVPositif")
.onclick = () => {

    let csv =
`Reference codial;Fournisseur;Machine;Marque;Materiel;Reference;Denomination;Debut;Entrees;Sorties;StockFin;Minimum
`;

    stock
    .filter(a => stockFin(a) > 0)
    .forEach(a => {

        csv +=
`${a.codial};${a.fournisseur};${a.machine};${a.marque};${a.materiel};${a.reference};${a.denomination};${a.debut};${a.entrees};${a.sorties};${stockFin(a)};${a.minimum}
`;

    });

    const blob = new Blob(
        [csv],
        { type:"text/csv;charset=utf-8;" }
    );

    const url =
        URL.createObjectURL(blob);

    const lien =
        document.createElement("a");

    lien.href = url;
    lien.download =
        "stock_positif_fes_fcm.csv";

    lien.click();
};


/* ===================================
   MODELE CSV
=================================== */
document
.getElementById("btnDownloadModel")
.onclick = () => {

    const modele =
`Reference codial;Fournisseur;Machine;Marque;Materiel;Reference;Denomination;Debut;Entrees;Sorties;StockFin;Minimum
12345;Fournisseur Exemple;Tracteur;John Deere;Filtre;FD-001;Filtre hydraulique;10;0;0;10;2`;

    const blob = new Blob(
        [modele],
        {
            type: "text/csv;charset=utf-8;"
        }
    );

    const url = URL.createObjectURL(blob);

    const lien = document.createElement("a");
    lien.href = url;
    lien.download = "modele_stock_fes_fcm.csv";
    lien.click();

    URL.revokeObjectURL(url);
};

/* ===================================
   RESET
=================================== */

document
.getElementById(

/* ===================================
   CHARGEMENT XLSX
=================================== */

async function chargerXLSX(){

    if(window.XLSX){
        return;
    }

    await new Promise(resolve => {

        const script =
        document.createElement(
            "script"
        );

        script.src =
        "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";

        script.onload =
        resolve;

        document.head.appendChild(
            script
        );

    });

}
/* ===================================

document

)
.onclick = async () => {

        "Machine":

        "Marque":
        item.marque || "",

        "Materiel":
        item.materiel || "",

        "Reference":
        item.reference || "",

        "Denomination":
        item.denomination || "",

        "Debut":
        item.debut || 0,

        "Entrees":
        item.entrees || 0,

        "Sorties":
        item.sorties || 0,

        "StockFin":
        stockFin(item),

        "Minimum":
        item.minimum || 0

    }));

    const ws =
    XLSX.utils.json_to_sheet(
        data
    );

    const wb =
    XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        wb,
        ws,
        "Stock"
    );

    XLSX.writeFile(
        wb,
        "stock_fes_fcm.xlsx"
    );

};
document
.getElementById(
    "fileInput"
)
.addEventListener(
"change",
async function(){

    const file =
    this.files[0];

    if(!file) return;

    if(
        file.name
        .toLowerCase()
        .endsWith(".csv")
    ){

        importerCSV(file);

    }
    else if(

        file.name
        .toLowerCase()
        .endsWith(".xlsx")

        ||

        file.name
        .toLowerCase()
        .endsWith(".xls")

    ){

        await chargerXLSX();

        importerExcel(file);

    }

});

/* ===================================
   ARTICLES À COMMANDER
=================================== */

document
.getElementById("btnOrder")
.onclick = () => {

    const articles =
    stock.filter(
        a => stockFin(a) < a.minimum
    );

    if(articles.length === 0){

        alert(
            "Aucun article à commander."
        );

        return;
    }

    let html = `

    <div id="commandePopup"
    style="
        position:fixed;
        top:5%;
        left:5%;
        width:90%;
        max-height:85%;
        overflow:auto;
        background:white;
        border:2px solid #005A9C;
        border-radius:10px;
        padding:20px;
        z-index:99999;
        box-shadow:0 0 20px rgba(0,0,0,.3);
    ">

    <h2>
    📦 Articles à commander
    </h2>

    <table
    style="
        width:100%;
        border-collapse:collapse;
    ">

    <tr>
        <th>Référence</th>
        <th>Dénomination</th>
        <th>Stock actuel</th>
        <th>Stock mini</th>
        <th>Qté proposée</th>
    </tr>
    `;

articles.forEach((a,index) => {

    const stockActuel = stockFin(a);

    const qteProposee =
    a.qteCommande ??
    Math.max(
        a.minimum - stockActuel,
        0
    );

    html += `
    <tr>

    <td>${a.reference}</td>

    <td>${a.denomination}</td>

    <td>${stockActuel}</td>

    <td>${a.minimum}</td>

    <td>
        <input
        type="number"
        min="0"
        value="${qteProposee}"
        id="qteCommande${index}"
        style="width:80px">
    </td>

    </tr>
    `;
});


    html += `

    </table>

    <br>

  <button
onclick="fermerCommandePopup()"
style="
background:#d32f2f;
color:white;
font-weight:bold;
padding:12px 25px;
border:none;
border-radius:8px;
cursor:pointer;
">
❌ Fermer
</button>

    </div>
    `;

    const ancienne =
    document.getElementById(
        "commandePopup"
    );

    if(ancienne){
        ancienne.remove();
    }

    document.body
    .insertAdjacentHTML(
        "beforeend",
        html
    );

};

async function chargerPDF(){

    if(window.jspdf){
        return;
    }

    await new Promise(resolve => {

        const script =

        document.createElement(
            "script"
        );

        script.src =

        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";

        script.onload =
        resolve;

        document.head.appendChild(
            script
        );

    });

}

/* ===================================
   EXPORT PDF
=================================== */

document
.getElementById("btnPDF")
.onclick = async () => {
    const popup =
    document.getElementById(
        "commandePopup"
    );

    if(popup){
        fermerCommandePopup();
    }
    await chargerPDF();

    const { jsPDF } =
    window.jspdf;

    const pdf =
    new jsPDF();

    const articles =

    stock.filter(
        a =>
        stockFin(a) <
        a.minimum
    );

    if(
        articles.length === 0
    ){

        alert(
            "Aucun article à commander."
        );

        return;

    }

    pdf.setFontSize(18);

    pdf.text(
        "Articles à commander FES / FCM",
        20,
        20
    );

    let y = 40;

    articles.forEach(a => {

        if(y > 260){

            pdf.addPage();

            y = 20;

        }

        pdf.setFontSize(12);

        pdf.text(

            `${a.reference}`,

            20,

            y

        );

        y += 8;

        pdf.text(

            `${a.denomination}`,

            20,

            y

        );

        y += 8;

        pdf.text(

            `Stock : ${stockFin(a)} / Mini : ${a.minimum}`,

            20,

            y

        );

        y += 8;

        pdf.text(

            `Commande : ${a.qteCommande || 0}`,

            20,

            y

        );

        y += 15;

    });

    pdf.save(
        "commande_fes_fcm.pdf"
    );

};



/* ===================================
   IMPORT EXCEL
=================================== */

function importerExcel(file){

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        const data =
        new Uint8Array(
            e.target.result
        );

        const workbook =

        XLSX.read(
            data,
            {
                type:"array"
            }
        );

        const sheet =

        workbook.Sheets[
            workbook.SheetNames[0]
        ];

        const json =

        XLSX.utils.sheet_to_json(
            sheet,
            {
                defval:""
            }
        );

        stock = [];

        json.forEach(row => {

            stock.push(

                creerIndexRecherche({

                    codial:

                    row[
                    "Reference codial"
                    ] || "",

                    fournisseur:

                    row[
                    "Fournisseur"
                    ] || "",

                    machine:

                    row[
                    "Machine"
                    ] || "",

                    marque:

                    row[
                    "Marque"
                    ] || "",

                    materiel:

                    row[
                    "Materiel"
                    ] || "",

                    reference:

                    row[
                    "Reference"
                    ] || "",

                    denomination:

                    row[
                    "Denomination"
                    ] || "",

                    debut:

                    Number(
                        row["Debut"]
                    ) || 0,

                    entrees:

                    Number(
                        row["Entrees"]
                    ) || 0,

                    sorties:

                    Number(
                        row["Sorties"]
                    ) || 0,

                    minimum:

                    Number(
                        row["Minimum"]
                    ) || 0

                })

            );

        });

        sauvegarder();

        afficher();

        alert(
            stock.length +
            " article(s) importé(s)."
        );

    };

    reader.readAsArrayBuffer(
        file
    );

}

function importerCSV(file){

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        const lignes =

        e.target.result

        .split(/\r?\n/)

        .map(l => l.trim())

        .filter(l => l !== "");

        if(
            lignes.length < 2
        ){

            alert(
                "Fichier vide."
            );

            return;

        }

        stock = [];

        lignes
        .slice(1)
        .forEach(ligne => {

            const cols =
            ligne.split(";");

            stock.push(

                creerIndexRecherche({

                    codial:
                    cols[0] || "",

                    fournisseur:
                    cols[1] || "",

                    machine:
                    cols[2] || "",

                    marque:
                    cols[3] || "",

                    materiel:
                    cols[4] || "",

                    reference:
                    cols[5] || "",

                    denomination:
                    cols[6] || "",

                    debut:
                    Number(cols[7]) || 0,

                    entrees:
                    Number(cols[8]) || 0,

                    sorties:
                    Number(cols[9]) || 0,

                    minimum:
                    Number(cols[11]?? 0)

                })

            );

        });

        sauvegarder();

        afficher();

        alert(
            stock.length +
            " article(s) importé(s)."
        );

    };

    reader.readAsText(
        file,
        "UTF-8"
    );

}

function fermerCommandePopup(){

    const articles =
    stock.filter(
        a => stockFin(a) < a.minimum
    );

    articles.forEach((a,index)=>{

        const champ =
        document.getElementById(
            `qteCommande${index}`
        );

        if(champ){

            a.qteCommande =
            Number(champ.value) || 0;

        }

    });

    sauvegarder();

    afficher(); // <-- AJOUTER CETTE LIGNE

    document
    .getElementById(
        "commandePopup"
    )
    ?.remove();

}

    appliqueModeSombreAuto,
